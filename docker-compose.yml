version: '3'

services:
  postgres:
    image: postgres:13
    container_name: postgres
    environment:
      POSTGRES_USER: ian
      POSTGRES_PASSWORD: project
      POSTGRES_DB: bigdata
    ports:
      - "5432:5432"
    volumes:
      - project-pgdata:/var/lib/postgresql/data

  postgres2:
    image: postgres:13
    container_name: postgres2
    environment:
      POSTGRES_USER: ian
      POSTGRES_PASSWORD: project
      POSTGRES_DB: airflow_metadata
    ports:
      - "5433:5432"
    volumes:
      - airflow-pgdata:/var/lib/postgresql/data

  redis:
    image: redis:5
    container_name: redis
    ports:
      - "6379:6379"

  airflow-webserver:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    image: airflow-webserver:latest
    container_name: airflow-webserver
    environment:
      - AIRFLOW__CORE__EXECUTOR=CeleryExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://ian:project@postgres2:5432/airflow_metadata
      - AIRFLOW__CELERY__BROKER_URL=redis://redis:6379/0
      - AIRFLOW__CELERY__RESULT_BACKEND=redis://redis:6379/0
      - AIRFLOW__WEBSERVER__WEB_SERVER_PORT=8080
    ports:
      - "8080:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./airflow/scripts:/opt/airflow/scripts
      - ./nba-data:/opt/airflow/nba_data
      - ./init:/opt/airflow/init
      - ./jar:/opt/airflow/jar
    depends_on:
      - postgres2
      - redis
    command: bash -c "/bin/bash /opt/airflow/init/init_wait.sh"

  airflow-scheduler:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    image: airflow-scheduler:latest
    container_name: airflow-scheduler
    environment:
      - AIRFLOW__CORE__EXECUTOR=CeleryExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://ian:project@postgres2:5432/airflow_metadata
      - AIRFLOW__CELERY__BROKER_URL=redis://redis:6379/0
      - AIRFLOW__CELERY__RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./airflow/scripts:/opt/airflow/scripts
      - ./nba-data:/opt/airflow/nba_data
      - ./init:/opt/airflow/init
      - ./jar:/opt/airflow/jar
    depends_on:
      - postgres2
      - redis
    command: scheduler

  airflow-worker:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    image: airflow-worker:latest
    container_name: airflow-worker
    environment:
      - AIRFLOW__CORE__EXECUTOR=CeleryExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://ian:project@postgres2:5432/airflow_metadata
      - AIRFLOW__CELERY__BROKER_URL=redis://redis:6379/0
      - AIRFLOW__CELERY__RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./airflow/scripts:/opt/airflow/scripts
      - ./nba-data:/opt/airflow/nba_data
      - ./jar:/opt/airflow/jar
    depends_on:
      - redis
      - postgres2
    command: celery worker

  spark:
    image: bitnami/spark:latest
    container_name: spark
    environment:
      - SPARK_MODE=master
      - SPARK_MASTER_URL=spark://spark:7077
    ports:
      - "8081:8081"
    volumes:
      - ./nba-data:/opt/airflow/nba_data
      - ./jar:/opt/airflow/jar

  spark-worker:
    image: bitnami/spark:latest
    container_name: spark-worker
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark:7077
    depends_on:
      - spark
    volumes:
      - ./nba-data:/opt/airflow/nba_data
      - ./jar:/opt/airflow/jar

  airflow-init:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    image: airflow-init:latest
    container_name: airflow-init
    environment:
      - AIRFLOW__CORE__EXECUTOR=CeleryExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://ian:project@postgres2:5432/airflow_metadata
      - AIRFLOW__CELERY__BROKER_URL=redis://redis:6379/0
      - AIRFLOW__CELERY__RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - ./init:/opt/airflow/init
    depends_on:
      - postgres2
      - redis
    command: bash -c "/bin/bash /opt/airflow/init/init_airflow.sh"
    
  superset:
    build:
      context: .
      dockerfile: superset/Dockerfile
    image: custom-superset:latest
    container_name: superset
    environment:
      SUPERSET_SECRET_KEY: 'devkey'
      SUPERSET_DATABASE_URI: postgresql+psycopg2://ian:project@postgres:5432/bigdata
    ports:
      - "8088:8088"
    depends_on:
      - postgres
    volumes:
      - ./superset:/app/superset_home
    command: >
      /bin/bash -c "
        superset db upgrade &&
        superset fab create-admin \
          --username ian \
          --firstname Ian \
          --lastname Romero \
          --email ian.romero@edu.uag.mx \
          --password admin &&
        superset init &&
        superset run -h 0.0.0.0 -p 8088
      "

volumes:
  project-pgdata:
  airflow-pgdata:
